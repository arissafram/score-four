<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Score Four</title>
<link rel="stylesheet" href="src/style.css">
<style>
  html, body { margin: 0; height: 100%; }
  #app { height: 100%; }
</style>
<!-- Dev page with no build step: Three.js comes from a CDN. The package declares `three` as a
     dependency instead, and the host's bundler resolves it. -->
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app"></div>
<script type="module">
  import { mount } from './src/app.js';
  window.scoreFour = mount(document.getElementById('app'));
</script>
</body>
</html>
